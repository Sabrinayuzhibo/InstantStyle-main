paths:
  # SDXL base model (Diffusers format)
  base_model_path: /root/autodl-tmp/AI_Models/stable-diffusion-xl-base-1.0
  # SDXL canny controlnet
  controlnet_path: diffusers_models/controlnet-canny-sdxl-1.0
  # IP-Adapter image encoder
  image_encoder_path: sdxl_models/image_encoder
  # IP-Adapter checkpoint
  ip_ckpt: sdxl_models/ip-adapter_sdxl.bin
  # 每个 style 随机对应一个 cnt 的任务文件
  pairs_jsonl: pairs_sdxl_style_rank_cnt1_rand.jsonl
  # 输出目录
  output_dir: outputs_sdxl_style_rank_cnt1_rand

runtime:
  device: cuda
  enable_xformers: true

model_loading:
  # 降低加载峰值，避免 137
  base_model_variant: fp16
  base_model_use_safetensors: true
  controlnet_use_safetensors: false

ip_adapter:
  target_blocks:
    - up_blocks.0.attentions.1
  adain_ip: true
  adain_alpha: 1.0
  adain_beta: 1.0

preprocess:
  canny_low_threshold: 50
  canny_high_threshold: 200

output:
  use_control_image_size: true
  width: null
  height: null

debug:
  print_adain_stats: true
  adain_processor_sample_count: 5

generate:
  # 当 jsonl 无 prompt 时兜底
  prompt: "high quality"
  negative_prompt: "text, watermark, lowres, low quality, worst quality, deformed, glitch, low contrast, noisy, saturation, blurry"
  # 开启后优先使用 jsonl 每条的 prompt
  read_prompt_from_jsonl: true
  # 你的当前 jsonl 没有 negative_prompt，这里默认关闭
  read_negative_prompt_from_jsonl: false
  scale: 1.0
  guidance_scale: 5
  num_samples: 1
  num_inference_steps: 20
  seed: 42
  controlnet_conditioning_scale: 0.6
