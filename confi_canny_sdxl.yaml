paths:
  # Diffusers 格式的 SDXL 基础模型目录（需包含 model_index.json）
  base_model_path: /root/autodl-tmp/AI_Models/stable-diffusion-xl-base-1.0
  # Canny 版 SDXL ControlNet 权重目录
  controlnet_path: diffusers_models/controlnet-canny-sdxl-1.0
  # IP-Adapter 的图像编码器目录（SDXL）
  image_encoder_path: sdxl_models/image_encoder
  # IP-Adapter 权重文件（SDXL）
  ip_ckpt: sdxl_models/ip-adapter_sdxl.bin
  # 风格参考图（IP-Adapter 输入）
  style_image_path: images_test_ref/blue.jpg
  # 结构控制图（会先做 Canny，再送入 ControlNet）
  control_image_path: images_content/003.jpg
  # 可选：直接指定现成 Canny 图；设置后优先使用该图，不再从 control_image_path 现算
  canny_image_path: canny_to_use/003_canny.png
  # 批量任务文件（jsonl），每行一个对象：{"style_image_path": "...", "control_image_path": "..."}
  pairs_jsonl: null
  # 批量模式输出目录；若未设置则回退到 output_image_path 的父目录
  output_dir: outputs_sdxl
  output_image_path: tmp/result_003.png

runtime:
  # 推理设备：cuda/cpu
  device: cuda
  # 启用 xformers memory efficient attention（仅 CUDA）
  enable_xformers: true

model_loading:
  # 本地权重是否按 safetensors 加载
  controlnet_use_safetensors: false

ip_adapter:
  # 指定哪些 UNet block 启用 IP-Adapter（可多选）
  target_blocks:
    - up_blocks.0.attentions.1
  # 是否启用 AdaIN 风格融合
  adain_ip: true
  # AdaIN 中 std 融合权重（0~1）
  adain_alpha: 1.0
  # AdaIN 中 mean 融合权重（0~1）
  adain_beta: 1.0

preprocess:
  # Canny 低阈值
  canny_low_threshold: 50
  # Canny 高阈值
  canny_high_threshold: 200

output:
  # true: 输出尺寸跟控制图一致；false: 使用 width/height
  use_control_image_size: true
  width: null
  height: null

debug:
  # 是否打印 AdaIN 自检统计
  print_adain_stats: true
  # 输出命中的 AdaIN processor 样本数量
  adain_processor_sample_count: 5

generate:
  prompt: "A beautiful woman,blue hair,bright,close-up portrait,blue eyes hand near face, looking at viewer, watercolor painting style, soft pastel colors, light blue tones, aesthetic illustration, masterpiece, best quality, highly detailed"
  # 反向提示词
  negative_prompt: "text, watermark, lowres, low quality, worst quality, deformed, glitch, low contrast, noisy, saturation, blurry, ugly, bad anatomy"
  # 可选：用于“削弱参考图语义内容”的文本（不是普通 negative_prompt）
  # IP-Adapter 风格强度
  scale: 1.0
  # 文本引导强度
  guidance_scale: 6
  # 每次生成张数
  num_samples: 1
  # 采样步数
  num_inference_steps: 30
  # 随机种子
  seed: 42
  # ControlNet 约束强度
  controlnet_conditioning_scale: 0.6
