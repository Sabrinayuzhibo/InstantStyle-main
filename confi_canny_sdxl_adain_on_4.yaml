paths:
  base_model_path: /root/autodl-tmp/AI_Models/stable-diffusion-xl-base-1.0
  controlnet_path: diffusers_models/controlnet-canny-sdxl-1.0
  image_encoder_path: sdxl_models/image_encoder
  ip_ckpt: sdxl_models/ip-adapter_sdxl.bin
  pairs_jsonl: pairs_sdxl_4.jsonl
  output_dir: outputs_sdxl_adain_on_4

runtime:
  device: cuda
  enable_xformers: true

model_loading:
  base_model_variant: fp16
  base_model_use_safetensors: true
  controlnet_use_safetensors: false

ip_adapter:
  target_blocks:
    - up_blocks.0.attentions.1
  adain_ip: true
  adain_alpha: 0.7
  adain_beta: 0.6

preprocess:
  canny_low_threshold: 50
  canny_high_threshold: 200

output:
  use_control_image_size: true
  width: null
  height: null

generate:
  prompt: "vibrant digital painting style, expressive brushstrokes,highly saturated,high quality"
  negative_prompt: "photorealistic, photorealism, photograph, monotone, grayscale, muted colors, low saturation, blurry, bad art."
  scale: 1.0
  guidance_scale: 5
  num_samples: 1
  num_inference_steps: 10
  seed: 42
  controlnet_conditioning_scale: 0.6
